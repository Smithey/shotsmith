[package]
name = "shotsmith-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSString"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNObservation", "objc2-core-graphics", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Ocr",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }
