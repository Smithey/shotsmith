[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/render",
  "crates/capture",
  "crates/platform",
  "crates/history",
  "crates/output",
  "crates/extensions",
  "crates/ocr",
  "crates/cli",
  "app/src-tauri",
]
exclude = ["shotsmith-pro"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
tiny-skia = "0.11"
shotsmith-core = { path = "crates/core" }
shotsmith-render = { path = "crates/render" }
shotsmith-capture = { path = "crates/capture" }
shotsmith-platform = { path = "crates/platform" }
shotsmith-history = { path = "crates/history" }
shotsmith-output = { path = "crates/output" }
shotsmith-extensions = { path = "crates/extensions" }
shotsmith-ocr = { path = "crates/ocr" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
