[package]
name = "shotsmith"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shotsmith screenshot and annotation tool"

[lib]
name = "shotsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
shotsmith-core = { workspace = true }
shotsmith-render = { workspace = true }
shotsmith-capture = { workspace = true }
shotsmith-platform = { workspace = true }
shotsmith-history = { workspace = true }
shotsmith-output = { workspace = true }
shotsmith-extensions = { workspace = true }
shotsmith-ocr = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
arboard = "3"
base64 = "0.22"
dirs = "5"
ureq = "2"
thiserror = { workspace = true }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSButton", "NSControl", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSSharingService", "NSImage", "NSImageView", "NSPrintOperation", "NSEvent", "block2", "libc"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL", "NSGeometry"] }
objc2-core-foundation = "0.3"
