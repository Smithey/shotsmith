# Pushing to main builds macOS and Windows installers and attaches them to GitHub Releases.
# Publishing waits until the release environment is approved.
# Every release also gets SHA256SUMS and a GitHub build attestation.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  approve:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - run: echo "Publishing is approved."

  build:
    needs: approve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Choose the bundle args
        id: bundle
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "args=--target x86_64-pc-windows-msvc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            python3 - <<'PY'
          import json, os
          json.dump({
              "bundle": {
                  "macOS": {
                      "signingIdentity": os.environ["APPLE_SIGNING_IDENTITY"],
                      "hardenedRuntime": True,
                  }
              }
          }, open("release-config.json", "w"))
          PY
            echo "args=--target aarch64-apple-darwin --config release-config.json" >> "$GITHUB_OUTPUT"
          else
            echo "args=--target aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: v__VERSION__-build.${{ github.run_number }}
          releaseName: Shotsmith v__VERSION__
          releaseBody: Installers for macOS and Windows. SHA256SUMS is added when both builds finish.
          releaseDraft: false
          prerelease: false
          args: ${{ steps.bundle.outputs.args }}

      - name: Sign the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE" ]; then
            echo "Installer left unsigned."
            exit 0
          fi
          echo "$WINDOWS_CERTIFICATE" | base64 -d > cert.pfx
          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -path '*/x64/signtool.exe' | sort | tail -n 1)
          test -n "$signtool"
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          tag="v${version}-build.${{ github.run_number }}"
          find target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' \) -print0 |
            while IFS= read -r -d '' file; do
              "$signtool" sign /f cert.pfx /p "$WINDOWS_CERTIFICATE_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$file"
              gh release upload "$tag" "$file" --clobber
            done
          rm -f cert.pfx

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-installers
          find target/release/bundle -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} release-installers/ \;
          find release-installers -type f -print
          test -n "$(find release-installers -type f -print -quit)"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-installers/*

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          tag="v${version}-build.${{ github.run_number }}"
          rm -rf dist
          mkdir dist
          gh release download "$tag" --dir dist --clobber
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum -- *) > SHA256SUMS
          gh release upload "$tag" SHA256SUMS --clobber
          {
            echo "macOS 14 or newer, Apple silicon."
            echo "Windows 11, 64-bit. SmartScreen may warn if the installer is unsigned."
            echo
            echo "SHA256SUMS:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "On a Mac, from the folder with these files: shasum -a 256 -c SHA256SUMS"
            echo "On Windows, compare Get-FileHash output with the hash above."
            echo
            echo "GitHub build attestation: gh attestation verify FILE --repo Smithey/shotsmith"
            echo
            echo "Use the disk image from this release on other Macs. A build made on your own Mac opens on that Mac only."
          } > release-notes.md
          gh release edit "$tag" --notes-file release-notes.md
